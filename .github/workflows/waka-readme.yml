name: Waka Readme

on:
  workflow_dispatch:

  schedule:
    # Todos os dias às 00:17 UTC
    # Aproximadamente 21:17 no horário de Brasília
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime statistics
    runs-on: ubuntu-latest

    steps:
      - name: Update WakaTime stats in README
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_6_months
          SHOW_TITLE: true
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
