name: Waka Readme

on:
  workflow_dispatch:

  schedule:
    # Executa todos os dias à meia-noite UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime statistics
    runs-on: ubuntu-latest

    steps:
      - name: Update WakaTime stats in README
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Exibe os dados dos últimos seis meses
          TIME_RANGE: last_6_months

          # Configurações visuais
          SHOW_TITLE: true
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
